# Đối chiếu tỷ giá trung tâm USD/VND: SBV công bố vs TCB hiển thị
# Chạy hoàn toàn trên GitHub Actions (không cần máy tính, không cần Claude):
#   8:30 sáng hằng ngày (giờ VN) → đọc SBV + TCB → so sánh → ghi tygia/ → gửi Viber kênh riêng.
# Nếu TCB chưa cập nhật số hôm nay hoặc còn lệch SBV, tự đọc lại mỗi 5 phút đến 09:20.
#
# Cần secret: VIBER_TOKEN_TYGIA (token kênh Viber riêng).
# Chạy tay: tab Actions → workflow này → Run workflow (có tuỳ chọn dry_run).
# Đẩy thay đổi vào tygia/check.py hoặc file này → tự chạy thử dry-run,
# kết quả ghi vào tygia/test/, không gửi Viber.

name: Đối chiếu tỷ giá trung tâm SBV–TCB

on:
  schedule:
    - cron: '30 1 * * *'        # 01:30 UTC = 08:30 giờ Việt Nam
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chạy thử: ghi vào tygia/test/, không gửi Viber'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'tygia/check.py'
      - '.github/workflows/tygia-doichieu.yml'

permissions:
  contents: write

concurrency:
  group: tygia-doichieu
  cancel-in-progress: false

jobs:
  doichieu:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TZ: Asia/Ho_Chi_Minh
      DRY_RUN: ${{ github.event_name == 'push' || inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cài trình duyệt dự phòng (Playwright Chromium)
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null

      - name: Đọc và đối chiếu
        env:
          OUT_DIR: ${{ env.DRY_RUN == 'true' && 'tygia/test' || 'tygia' }}
          WAIT_UNTIL: ${{ env.DRY_RUN == 'true' && '00:00' || '09:20' }}
        run: python3 tygia/check.py

      - name: Lưu bản sao theo ngày
        if: env.DRY_RUN != 'true'
        run: |
          mkdir -p tygia/archive
          cp tygia/bao-cao.txt "tygia/archive/$(date +%Y-%m-%d).txt"

      - name: Commit và đẩy kết quả
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tygia/
          if git diff --cached --quiet; then echo "Không có gì thay đổi"; exit 0; fi
          msg="Đối chiếu tỷ giá trung tâm $(date +%d/%m/%Y)"
          [ "$DRY_RUN" = "true" ] && msg="$msg (chạy thử)"
          git commit -q -m "$msg"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "Push thất bại"; exit 1

      - name: Gửi Viber kênh riêng
        if: env.DRY_RUN != 'true'
        env:
          VIBER_TOKEN: ${{ secrets.VIBER_TOKEN_TYGIA }}
        run: |
          set -euo pipefail
          [ -n "${VIBER_TOKEN}" ] || { echo "Chưa có secret VIBER_TOKEN_TYGIA — dừng."; exit 1; }
          text=$(head -c 6500 tygia/bao-cao.txt)
          info=$(curl -sS -X POST https://chatapi.viber.com/pa/get_account_info \
            -H "X-Viber-Auth-Token: $VIBER_TOKEN" -H "Content-Type: application/json" -d '{}')
          admin_id=$(echo "$info" | jq -r '[.members[]? | select(.role == "superadmin") | .id][0] // empty')
          [ -n "$admin_id" ] || { echo "Không lấy được ID superadmin: $(echo "$info" | jq -c '{status, status_message}')"; exit 1; }
          payload=$(jq -n --arg from "$admin_id" --arg text "$text" \
            '{from: $from, sender: {name: "Đối chiếu tỷ giá"}, type: "text", text: $text}')
          resp=$(curl -sS -X POST https://chatapi.viber.com/pa/post \
            -H "X-Viber-Auth-Token: $VIBER_TOKEN" -H "Content-Type: application/json" -d "$payload")
          echo "$resp" | jq -c '{status, status_message}'
          [ "$(echo "$resp" | jq -r .status)" = "0" ] || { echo "Đăng bài thất bại"; exit 1; }
